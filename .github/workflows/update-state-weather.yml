name: Update state.json weather

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-state-weather
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            data
            scripts
          sparse-checkout-cone-mode: false
      
      - name: Update weather section in data/state.json
        env:
          WEATHER_LAT: ${{ secrets.WEATHER_LAT }}
          WEATHER_LON: ${{ secrets.WEATHER_LON }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
      
          OW_UNITS: ${{ vars.OW_UNITS }}
          INCLUDE_ALERTS: ${{ vars.INCLUDE_ALERTS }}
          WIND_WIGGLE_START: ${{ vars.WIND_WIGGLE_START }}
          WIND_WIGGLE_FULL: ${{ vars.WIND_WIGGLE_FULL }}
      
        run: bash scripts/update-weather-into-state.sh


      - name: Commit and push if changed
        run: |
          set -e
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git commit -m "Update weather in state.json"
          # state.json also carries other keys written from elsewhere (the
          # supporters list). If one landed since checkout, the push is
          # rejected: put this weather onto the latest file instead, changing
          # only .weather, and push again.
          weather="$(jq -c '.weather' data/state.json)"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected; reapplying the weather onto the latest ${GITHUB_REF_NAME}"
            sleep $((attempt * 3))
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            jq --argjson weather "$weather" '.weather = $weather' data/state.json > data/state.json.tmp
            mv data/state.json.tmp data/state.json
            if git diff --quiet; then
              echo "Already up to date."
              exit 0
            fi
            git add data/state.json
            git commit -m "Update weather in state.json"
          done
          echo "::error::Could not push the weather update after 3 tries"
          exit 1
